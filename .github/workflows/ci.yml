name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q anime_wallpaper_upscaler scripts tests

      - name: Check command-line help
        run: python scripts/upscale_wallpaper.py --help

      - name: Run PowerShell harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\powershell\setup.tests.ps1
          & .\tests\powershell\launcher.tests.ps1

  macos:
    name: macOS verification
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run tests and compile sources
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          python -m compileall -q anime_wallpaper_upscaler scripts tests
          bash -n install.command scripts/run-wallpaper.command
      - name: Install verified official macOS runtime
        run: ./install.command --accept-upstream-license --skip-skill
      - name: Run real 2x/3x/4x smoke checks
        run: .venv/bin/python scripts/verify_macos.py
